# One-click setup on Render: New → Blueprint → pick this repo.
databases:
  - name: dispo-606-db
    plan: 0.1c-256mb          # smallest paid Postgres (same plan as herhaus-hub); includes backups
    region: ohio              # closest Render region to Chicago
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: dispo606
    user: dispo606
    ipAllowList: []           # no public internet access; only the web service connects

services:
  - type: web
    name: 606-home-buyers
    runtime: python
    plan: 0.5c-512mb         # smallest paid size (same as herhaus-hub); needed for the persistent disk
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 --timeout 120 --access-logfile - -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    disk:
      name: dispo-606-photos
      mountPath: /var/data    # deal photos live here and survive redeploys
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: dispo-606-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false           # Render asks for this when you create the service
